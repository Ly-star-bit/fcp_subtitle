# Builds the app on a GitHub-hosted Apple Silicon runner.
#
# - push to main: build, run tests and package, without publishing — proves
#   the pipeline before a version goes out.
# - push a v* tag: the same, then publish a GitHub Release with the DMG and
#   RELEASE_NOTES_<tag>.md (its "{{SHA256}}" is filled in with the checksum).
#   The tag must match VERSION in gui/scripts/package_app.sh.
#
# Publishing uses the workflow's own GITHUB_TOKEN, so releasing needs nothing
# but `git push origin vX.Y.Z` — no local gh login.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      FCP_SUBTITLE_PROXY: ""  # 直连;默认代理是开发机内网地址
      HOMEBREW_NO_AUTO_UPDATE: "1"
      SILERO_VAD_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      SILERO_VAD_SHA256: 9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6
    steps:
      - uses: actions/checkout@v7

      - name: 检查版本号和发布说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "VERSION=\"$version\"" gui/scripts/package_app.sh \
            || { echo "标签 $GITHUB_REF_NAME 与 package_app.sh 里的 VERSION 不一致" >&2; exit 1; }
          test -f "RELEASE_NOTES_$GITHUB_REF_NAME.md" \
            || { echo "缺少 RELEASE_NOTES_$GITHUB_REF_NAME.md" >&2; exit 1; }

      - name: 准备依赖 (sherpa-onnx、onnxruntime、VAD 模型、uv)
        run: |
          gui/scripts/fetch_deps.sh
          mkdir -p models
          curl -fL --retry 3 -o models/silero_vad.onnx "$SILERO_VAD_URL"
          echo "$SILERO_VAD_SHA256  models/silero_vad.onnx" | shasum -a 256 -c -
          brew install uv

      - name: 单元测试
        run: gui/scripts/test.sh

      - name: 打包 DMG
        run: |
          gui/scripts/package_app.sh
          shasum -a 256 "gui/dist/FCP字幕.dmg"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub mangles non-ASCII asset names (v1.0.0 became "FCP.-.dmg").
          asset="FCPSubtitle-$version.dmg"
          cp "gui/dist/FCP字幕.dmg" "$asset"
          sha=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          sed "s/{{SHA256}}/$sha/" "RELEASE_NOTES_$GITHUB_REF_NAME.md" > release_notes.md
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "$GITHUB_REF_NAME" --notes-file release_notes.md --verify-tag
